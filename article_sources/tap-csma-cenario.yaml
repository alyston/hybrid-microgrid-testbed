networks:
  rede_direta:
    driver: macvlan
    driver_opts:
      parent: eno1  # <-- Interface física do IEESimulRedes
    ipam:
      config:
        - subnet: 192.168.0.0/24    # Faixa da sua rede real
          gateway: 192.168.0.1     # Gateway roteador físico Sem Acesso a Internet.



# Arquivo usado para criar 6 containers docker para fazer interface OP4610XG com o Simulador de Rede NS3 e o EMS.
