
services:
  interfacePOI:
    image: "golang-alpine-dev"
    container_name: interfacePOI
    build: .
    networks: 
       rede_direta:
         ipv4_address: 192.168.0.30  # IPs da rede física
    cap_add:
      - NET_ADMIN  # Permissão para alterar na rede
      - NET_RAW
    tty: true
    stdin_open: true  
    #restart: always
   
    
  
  interfaceBESS:
